model:
  path: "models/best.pt"
  type: "YOLO11s-cls"  # Classification model
  device: "cpu"  # "cuda:0" nếu có GPU
  confidence_threshold: 0.70  # Ngưỡng confidence cho classification

classes:
  # YOLO tự động sort theo alphabet: glass=0, paper=1, plastic=2
  0: "glass"
  1: "paper"
  2: "plastic"

bin_mapping:
  glass: 3
  paper: 1
  plastic: 2

validation:
  # Image quality checks (điều chỉnh cho ESP32-CAM)
  cv_checks:
    blur_threshold: 10        # Giảm xuống - ESP32-CAM có độ nét thấp
    min_brightness: 25        # Giảm xuống - ESP32-CAM ảnh tối hơn
    max_brightness: 250       # Tăng lên
    blank_std_threshold: 10   # Giảm xuống - ESP32-CAM có ít chi tiết hơn
  
  # Model confidence checks
  model_checks:
    min_confidence: 0.60      # Giảm xuống cho ESP32-CAM

server:
  host: "0.0.0.0"
  port: 5000
  debug: false
  workers: 4                  # Workers (Gunicorn) hoặc Threads (Waitress)
  max_content_length: 5242880  # 5MB
  request_timeout: 30         # Timeout 30s

logging:
  level: "WARNING"            # Chỉ log WARNING trở lên (giảm I/O)
  file: "logs/server.log"
